<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCANLINE | Login & Sign Up</title>
  <meta name="description" content="Login or create a Scanline account to access the forensic image analysis platform.">

  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <div class="brand-logo-wrapper">
        <a href="index.html" class="brand-logo">
          <span class="dot-indicator"></span>
          <span>SCANLINE</span>
        </a>
        <span class="brand-meta-tag">IMAGE FORENSICS • v0.1</span>
      </div>
      <div class="nav-actions" id="navActionsArea"></div>
    </div>
  </header>

  <!-- Auth Page -->
  <main class="main-content">
    <div class="auth-page-wrapper">
      <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo-row">
          <span class="auth-logo-dot"></span>
          SCANLINE
        </div>

        <!-- Tabs: Login / Sign Up -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab-btn active" id="tabLogin" role="tab" aria-selected="true" onclick="switchTab('login')">
            <i class="fa-solid fa-right-to-bracket"></i> Login
          </button>
          <button class="auth-tab-btn" id="tabSignup" role="tab" aria-selected="false" onclick="switchTab('signup')">
            <i class="fa-solid fa-user-plus"></i> Sign Up
          </button>
        </div>

        <!-- ── Login Form ────────────────────────────── -->
        <form class="auth-form active" id="loginForm" autocomplete="on" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="loginUsername">Username</label>
            <input class="form-input" type="text" id="loginUsername" name="username"
                   placeholder="Enter your username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <input class="form-input" type="password" id="loginPassword" name="password"
                   placeholder="Enter your password" autocomplete="current-password" required>
          </div>
          <div class="auth-error" id="loginError"></div>
          <button class="auth-submit-btn" type="submit" id="loginBtn">
            <i class="fa-solid fa-right-to-bracket"></i> Login
          </button>
          <p class="auth-note">Don't have an account? <a href="#" onclick="switchTab('signup'); return false;">Create one</a></p>
        </form>

        <!-- ── Sign Up Form ──────────────────────────── -->
        <form class="auth-form" id="signupForm" autocomplete="on" onsubmit="handleSignup(event)">
          <div class="form-group">
            <label class="form-label" for="signupUsername">Username</label>
            <input class="form-input" type="text" id="signupUsername" name="username"
                   placeholder="Choose a username (min 3 chars)" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signupPassword">Password</label>
            <input class="form-input" type="password" id="signupPassword" name="password"
                   placeholder="Choose a password (min 6 chars)" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signupEmail">
              Email <span class="optional-tag">(optional)</span>
            </label>
            <input class="form-input" type="email" id="signupEmail" name="email"
                   placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="auth-error" id="signupError"></div>
          <div class="auth-success" id="signupSuccess"></div>
          <button class="auth-submit-btn" type="submit" id="signupBtn">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
          <p class="auth-note">Already have an account? <a href="#" onclick="switchTab('login'); return false;">Login</a></p>
        </form>

      </div>
    </div>
  </main>

  <script>
    const AUTH_TOKEN_KEY = 'scanline_auth_token';

    // Redirect if already logged in
    (async function checkExisting() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token) return;
      try {
        const res = await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` }});
        if (res.ok) { window.location.href = '/index.html'; }
      } catch { /* not logged in */ }
    })();

    function switchTab(tab) {
      const loginForm   = document.getElementById('loginForm');
      const signupForm  = document.getElementById('signupForm');
      const tabLogin    = document.getElementById('tabLogin');
      const tabSignup   = document.getElementById('tabSignup');

      if (tab === 'login') {
        loginForm.classList.add('active');
        signupForm.classList.remove('active');
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        tabLogin.setAttribute('aria-selected', 'true');
        tabSignup.setAttribute('aria-selected', 'false');
      } else {
        signupForm.classList.add('active');
        loginForm.classList.remove('active');
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
        tabSignup.setAttribute('aria-selected', 'true');
        tabLogin.setAttribute('aria-selected', 'false');
      }
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = '⚠ ' + msg;
      el.classList.add('show');
    }
    function hideError(id) {
      const el = document.getElementById(id);
      el.textContent = '';
      el.classList.remove('show');
    }
    function showSuccess(id, msg) {
      const el = document.getElementById(id);
      el.textContent = '✓ ' + msg;
      el.classList.add('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError('loginError');
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          showError('loginError', data.error || 'Login failed.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
          return;
        }
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Welcome back!';
        setTimeout(() => { window.location.href = '/index.html'; }, 600);
      } catch {
        showError('loginError', 'Server error. Make sure the server is running.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      hideError('signupError');
      const btn = document.getElementById('signupBtn');
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value;
      const email    = document.getElementById('signupEmail').value.trim();

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, email: email || undefined })
        });
        const data = await res.json();
        if (!res.ok) {
          showError('signupError', data.error || 'Registration failed.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
          return;
        }
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        showSuccess('signupSuccess', `Account created! Welcome, ${data.username} — redirecting...`);
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Account Created!';
        setTimeout(() => { window.location.href = '/index.html'; }, 900);
      } catch {
        showError('signupError', 'Server error. Make sure the server is running.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
      }
    }
  </script>
</body>
</html>
